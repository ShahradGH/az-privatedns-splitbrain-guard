<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #0a1128; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #94a3b8; }
      .lane { fill: #0f1b3d; stroke: #1e3a8a; stroke-width: 2; rx: 10; }
      .actor { fill: #162447; stroke: #38bdf8; stroke-width: 2.5; rx: 10; }
      .actor-ai { fill: #1a1f4a; stroke: #c084fc; stroke-width: 2.5; rx: 10; }
      .actor-graph { fill: #0d2e26; stroke: #10b981; stroke-width: 2.5; rx: 10; }
      .lifeline { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .msg-box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .gate-box { fill: #2a183b; stroke: #c084fc; stroke-width: 2; rx: 8; }
      .veto-box { fill: #3b0d1d; stroke: #fb7185; stroke-width: 2; rx: 8; }
      .txt-hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .txt-sub { font-family: 'Consolas', monospace; font-size: 13px; fill: #94a3b8; text-anchor: middle; }
      .txt-step { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      .txt-code { font-family: 'Consolas', monospace; font-size: 13px; fill: #38bdf8; }
      .txt-veto { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #fb7185; }
      .arrow-blue { stroke: #38bdf8; stroke-width: 3; fill: none; marker-end: url(#m-blue); }
      .arrow-red { stroke: #fb7185; stroke-width: 3; fill: none; marker-end: url(#m-red); }
      .arrow-purple { stroke: #c084fc; stroke-width: 3; fill: none; marker-end: url(#m-purple); }
      .arrow-green { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#m-green); }
    </style>
    <marker id="m-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="m-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb7185"/></marker>
    <marker id="m-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text x="60" y="65" class="title">Split-Brain Prevention &amp; AI Diagnostic Sequence Flow</text>
  <text x="60" y="98" class="subtitle">End-to-End Deterministic Gate: Wire-Server Probe -&gt; ARG Hunter -&gt; AI Confidence Gate -&gt; Microsoft Graph v2.x NetOps Alert</text>

  <!-- 5 Lifelines -->
  <!-- 1: Spoke Workload (x=210) -->
  <rect class="actor" x="80" y="135" width="260" height="75"/>
  <text x="210" y="168" class="txt-hdr">Spoke Workload</text>
  <text x="210" y="192" class="txt-sub">Resolve-DnsName (172.18.4.10)</text>
  <line class="lifeline" x1="210" y1="210" x2="210" y2="990"/>

  <!-- 2: 168.63.129.16 + Hub (x=570) -->
  <rect class="actor" x="440" y="135" width="260" height="75"/>
  <text x="570" y="168" class="txt-hdr">168.63.129.16 &amp; Hub</text>
  <text x="570" y="192" class="txt-sub">Wire-Server / Private Resolver</text>
  <line class="lifeline" x1="570" y1="210" x2="570" y2="990"/>

  <!-- 3: ARG & Policy Guard (x=950) -->
  <rect class="actor" x="820" y="135" width="260" height="75"/>
  <text x="950" y="168" class="txt-hdr">ARG Rogue Hunter</text>
  <text x="950" y="192" class="txt-sub">Wait-PrivateDnsRecordConvergence</text>
  <line class="lifeline" x1="950" y1="210" x2="950" y2="990"/>

  <!-- 4: AI Diagnostician (x=1330) -->
  <rect class="actor-ai" x="1200" y="135" width="260" height="75"/>
  <text x="1330" y="168" class="txt-hdr">AI Trace Assistant</text>
  <text x="1330" y="192" class="txt-sub">Diagnose-PrivateDnsTrace.ps1</text>
  <line class="lifeline" x1="1330" y1="210" x2="1330" y2="990"/>

  <!-- 5: Graph NetOps (x=1700) -->
  <rect class="actor-graph" x="1570" y="135" width="270" height="75"/>
  <text x="1705" y="168" class="txt-hdr">Graph v2.x NetOps</text>
  <text x="1705" y="192" class="txt-sub">Invoke-MgGraphRequest -&gt; Teams</text>
  <line class="lifeline" x1="1705" y1="210" x2="1705" y2="990"/>

  <!-- Step 1 -->
  <path class="arrow-blue" d="M 210 270 L 560 270"/>
  <rect class="msg-box" x="245" y="235" width="290" height="30"/>
  <text x="260" y="255" class="txt-step">1. DNS Query: stprod.blob.core.windows.net</text>

  <!-- Step 2 -->
  <path class="arrow-red" d="M 570 350 L 220 350"/>
  <rect class="veto-box" x="235" y="312" width="315" height="32"/>
  <text x="250" y="333" class="txt-veto">2. Rogue Zone NXDOMAIN -&gt; Public IP 198.51.100.x</text>

  <!-- Step 3 -->
  <path class="arrow-blue" d="M 210 435 L 940 435"/>
  <rect class="msg-box" x="420" y="400" width="340" height="30"/>
  <text x="435" y="420" class="txt-step">3. Run Test-PrivateDnsSplitBrainGuard.ps1</text>

  <!-- Step 4 -->
  <path class="arrow-red" d="M 950 520 L 580 520"/>
  <rect class="veto-box" x="605" y="482" width="320" height="32"/>
  <text x="620" y="503" class="txt-veto">4. ARG Query: Spoke privatelink.* Detected</text>

  <!-- Step 5 -->
  <path class="arrow-purple" d="M 950 615 L 1320 615"/>
  <rect class="gate-box" x="985" y="578" width="305" height="32"/>
  <text x="1000" y="599" class="txt-step">5. Correlate Trace + ARG + ZoneGroup</text>

  <!-- Step 6: AI Gate Box -->
  <rect class="gate-box" x="1150" y="650" width="360" height="125"/>
  <text x="1170" y="680" class="txt-step">6. AI Pattern &amp; Abstention Gate:</text>
  <text x="1170" y="705" class="txt-code">• Strip prompt-injection tokens from TXT/CNAME</text>
  <text x="1170" y="728" class="txt-code">• Score SHADOW_SPOKE_ZONE (0.96 &gt;= 0.72)</text>
  <text x="1170" y="751" class="txt-code">• If &lt; 0.72 -&gt; ABSTAIN_ESCALATE_NETOPS</text>

  <!-- Step 7 -->
  <path class="arrow-green" d="M 1330 835 L 1695 835"/>
  <rect class="msg-box" x="1365" y="798" width="305" height="32"/>
  <text x="1380" y="819" class="txt-step">7. POST /teams/{id}/channels/{id}/messages</text>

  <!-- Step 8 -->
  <rect class="actor-graph" x="1555" y="870" width="300" height="90"/>
  <text x="1705" y="905" class="txt-hdr">NetOps Adaptive Card</text>
  <text x="1705" y="930" class="txt-sub">FQDN + Rogue Zone + KQL Hint</text>
  <text x="1705" y="950" class="txt-sub">Optional SharePoint Audit Item</text>
</svg>
